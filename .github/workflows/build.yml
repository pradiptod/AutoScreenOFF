name: Build AutoScreen OEM

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o AutoScreenOEM-cloud-build.zip

      - name: Fix permissions
        run: |
          chmod -R u+rwX AutoScreenOEM-cloud-build
          chmod -R u+rwX "$RUNNER_TEMP"

      - name: Fix Android manifest
        working-directory: AutoScreenOEM-cloud-build
        run: |
          sed -i '/android:description="Izinkan AutoScreen mengunci display untuk mematikannya"/d' app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: AutoScreenOEM-cloud-build
        run: |
          gradle --no-daemon --project-cache-dir "$RUNNER_TEMP/gradle-project-cache" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoScreenOEM-APK
          path: AutoScreenOEM-cloud-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
